<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>貓房間預覽 · Cat room preview</title>
<!--
  =====================================================================
  cat-preview.html — THE REAL UI, on its own page
  =====================================================================
  This shows EXACTLY what a visitor will see, with nothing added. It is
  here so you can look at the design, and change it, before it goes into
  the live app.

  The only thing on this page that a visitor would not get is the small
  grey strip at the bottom, for adding test coins.
  =====================================================================
-->
<style>
  :root{ --paper:#FAF5EA; --ink:#3A3029; --yolk:#F3B72B; --card:#FFFFFF; --tea:#247A5A; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
    line-height:1.55;padding:14px}
  /* The same bottom-sheet the real app uses, so the sizing is honest. */
  .sheet{max-width:480px;margin:0 auto;background:var(--paper);
    border:2.5px solid var(--ink);border-radius:22px;padding:16px;
    box-shadow:4px 4px 0 var(--ink)}
  .devbar{max-width:480px;margin:14px auto 40px;font-size:12.5px;opacity:.75;text-align:center}
  .devbar button{font-family:inherit;font-weight:700;font-size:12.5px;border:2px solid var(--ink);
    background:var(--card);color:var(--ink);border-radius:9px;padding:5px 10px;cursor:pointer;margin:2px}
</style>
</head>
<body>

<div class="sheet" id="panel"></div>

<div class="devbar">
  ↑ everything above is exactly what visitors see ↑<br>
  <button id="coins">+50 test coins</button>
  <button id="lang">中 / EN</button>
  <button id="visit">next visit</button>
  <button id="reset">reset cat</button>
</div>

<script src="foods-data.js"></script>
<script src="cat-items.js"></script>
<script src="cat-frames.js"></script>
<script src="pet-shared.js"></script>
<script src="cat-state.js"></script>
<script src="cat-room.js"></script>
<script>
  /* a plain message box, standing in for the app's toast */
  function toast(m){
    let el=document.getElementById('t');
    if(!el){ el=document.createElement('div'); el.id='t';
      el.style.cssText='position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:999;'+
        'background:#F3B72B;border:2.5px solid #3A3029;border-radius:14px;padding:8px 16px;'+
        'font-weight:800;box-shadow:3px 3px 0 #3A3029';
      document.body.appendChild(el); }
    el.textContent=m; el.style.display='block';
    clearTimeout(el._t); el._t=setTimeout(()=>el.style.display='none',1600);
  }

  let lang='zh';
  CatRoom.mount(document.getElementById('panel'), lang, toast);

  document.getElementById('coins').onclick=()=>{ Buddy.set('coins', Buddy.coins()+50); CatRoom.refresh(); };
  document.getElementById('lang').onclick =()=>{ lang = lang==='zh'?'en':'zh'; CatRoom.setLang(lang); };
  document.getElementById('visit').onclick=()=>{ CatState.noteVisit(); CatRoom.refresh(); };
  document.getElementById('reset').onclick=()=>{ Buddy.set('cat', CatState._blank()); CatRoom.refresh(); };
</script>
</body>
</html>
